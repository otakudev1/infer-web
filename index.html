<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<title>Infer — Hardik's personal AI</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/deep-chat@2.5.1/dist/deepChat.bundle.min.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0b0e14;color:#e6e9ef;height:100dvh;display:flex;flex-direction:column}
header{padding:12px 16px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #1c2230;flex-shrink:0;background:#0d111a}
header h1{font-size:1.05rem;margin:0;font-weight:600;letter-spacing:.02em}
header .badge{margin-left:auto;font-size:.65rem;color:#9aa4b8;border:1px solid #2b3345;padding:2px 8px;border-radius:999px}
deep-chat{flex:1;width:100%;max-width:760px;margin:0 auto;
  background:#0b0e14;border:none;box-sizing:border-box;
  --deep-chat-background-color:#0b0e14}
#alerts{max-width:760px;margin:0 auto;width:100%;padding:0 12px}
.alert{padding:9px 12px;border-radius:12px;margin:4px 0;font-size:.82rem;line-height:1.35}
.alert b{display:block;margin-bottom:1px}
.sev-extreme{background:#dc262622;border:1px solid #dc262655;color:#fca5a5}
.sev-severe{background:#ea580c22;border:1px solid #ea580c55;color:#fdba74}
.sev-moderate{background:#ca8a0422;border:1px solid #ca8a0466;color:#fde047}
.sev-minor{background:#2563eb22;border:1px solid #2563eb55;color:#93c5fd}
</style>
</head>
<body>
<header><span>⚡</span><h1>Infer</h1><span class="badge">v0.2 · keyless</span></header>
<div id="alerts"></div>
<deep-chat id="chat"
></deep-chat>

<script>
"use strict";
const WMO={0:["Clear sky","☀️"],1:["Mostly clear","🌤️"],2:["Partly cloudy","⛅"],3:["Overcast","☁️"],45:["Fog","🌫️"],48:["Rime fog","🌫️"],51:["Light drizzle","🌦️"],53:["Drizzle","🌦️"],55:["Dense drizzle","🌧️"],56:["Freezing drizzle","🌧️"],57:["Freezing drizzle","🌧️"],61:["Light rain","🌦️"],63:["Rain","🌧️"],65:["Heavy rain","🌧️"],66:["Freezing rain","🌧️"],67:["Freezing rain","🌧️"],71:["Light snow","🌨️"],73:["Snow","❄️"],75:["Heavy snow","❄️"],77:["Snow grains","🌨️"],80:["Light showers","🌦️"],81:["Showers","🌧️"],82:["Violent showers","⛈️"],85:["Snow showers","🌨️"],86:["Snow showers","🌨️"],95:["Thunderstorm","⛈️"],96:["Thunderstorm + hail","⛈️"],99:["Severe thunderstorm","⛈️"]};
const wmo=c=>WMO[c]||["Unknown","❓"];
const esc=s=>{const d=document.createElement("div");d.textContent=s??"";return d.innerHTML};

// ---------- LLM: robust path with fallbacks (kills the https errors) ----------
async function callLLM(prompt){
  const body=JSON.stringify({model:"openai",messages:[{role:"user",content:prompt}]});
  // 1) POST /open (best endpoint, CORS verified)
  try{
    const r=await fetch("https://text.pollinations.ai/openai",{method:"POST",headers:{"Content-Type":"application/json"},body});
    if(r.ok){const j=await r.json();const t=j?.choices?.[0]?.message?.content;if(t)return t}
    if(r.status!==402&&r.status!==429)throw new Error("POST /openai HTTP "+r.status);
  }catch(e){/* fall through */}
  // 2) GET short fallback
  try{
    const r=await fetch("https://text.pollinations.ai/"+encodeURIComponent(prompt.slice(0,400)));
    if(r.ok)return await r.text();
  }catch(e){/* fall through */}
  // 3) graceful degradation — never leave the user with a dead bubble
  return "";
}

// ---------- Weather: geocode + per-model fusion + alerts ----------
async function geocode(q){
  const r=await fetch("https://geocoding-api.open-meteo.com/v1/search?name="+encodeURIComponent(q)+"&count=1&language=en&format=json");
  if(!r.ok)throw new Error("Geocoding service error ("+r.status+")");
  const j=await r.json();const x=(j.results||[])[0];
  if(!x)throw new Error("Place not found: "+q);
  return x;
}
async function modelTemp(lat,lon,m){
  try{
    const r=await fetch("https://api.open-meteo.com/v1/forecast?latitude="+lat+"&longitude="+lon+"&current=temperature_2m&models="+m+"&timezone=auto");
    if(!r.ok)return null;
    const j=await r.json();return j?.current?.temperature_2m??null;
  }catch(e){return null}
}
async function forecast(lat,lon){
  const u="https://api.open-meteo.com/v1/forecast?latitude="+lat+"&longitude="+lon+
    "&current=temperature_2m,weather_code,wind_speed_10m,relative_humidity_2m,apparent_temperature"+
    "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max"+
    "&forecast_days=5&timezone=auto";
  const r=await fetch(u);
  if(!r.ok)throw new Error("Weather service error ("+r.status+")");
  return r.json();
}
async function alertsFor(place){
  try{
    if((place.country_code||"").toUpperCase()!=="US")return [];
    const r=await fetch("https://api.weather.gov/alerts/active?point="+place.latitude+","+place.longitude,{headers:{Accept:"application/geo+json"}});
    if(!r.ok)return [];
    const j=await r.json();return (j.features||[]).slice(0,3).map(f=>f.properties||{});
  }catch(e){return []}
}
function fusionCard(place,j,models){
  const temps=models.map(m=>m.temp).filter(t=>t!=null);
  const spread=temps.length>1?Math.max(...temps)-Math.min(...temps):0;
  const conf=Math.max(0,Math.min(100,Math.round(100-spread*10)));
  const cls=conf>=80?"high":conf>=60?"med":"low";
  const lbl=conf>=80?"HIGH":conf>=60?"MEDIUM":"LOW";
  const c=j.current||{};
  const [txt,ico]=wmo(c.weather_code);
  const d=j.daily||{};
  const days=(d.time||[]).slice(0,5).map((t,i)=>{
    const [,di]=wmo((d.weather_code||[])[i]);
    const mx=Math.round((d.temperature_2m_max||[])[i]),mn=Math.round((d.temperature_2m_min||[])[i]);
    const nm=new Date(t+"T12:00:00").toLocaleDateString(undefined,{weekday:"short"});
    return "<div style='flex:1;text-align:center;font-size:.72rem;color:#9aa4b8'><div style='font-size:1.1rem'>"+di+"</div><b style='color:#e6e9ef;font-size:.82rem'>"+mx+"°/"+mn+"°</b><br>"+nm+"</div>";
  }).join("");
  const names={best_match:"Best match",gfs_seamless:"GFS",icon_seamless:"ICON"};
  const rows=models.map(m=>{
    const mn=Math.min(...temps),mx=Math.max(...temps);
    const pct=mx>mn?((m.temp-mn)/(mx-mn))*100:100;
    return "<div style='display:flex;align-items:center;gap:8px;font-size:.8rem;margin:3px 0'><span style='width:70px;color:#9aa4b8'>"+(names[m.id]||m.id)+"</span><span style='flex:1;height:6px;background:#1c2230;border-radius:3px;overflow:hidden'><i style='display:block;height:100%;width:"+(pct||50)+"%;background:#3b82f6'></i></span><b>"+(m.temp!=null?Math.round(m.temp)+"°":"—")+"</b></div>";
  }).join("");
  return "<div style='font-weight:600;font-size:.95rem;margin-bottom:6px'>"+ico+" <b>"+esc(place.name)+"</b> <span style='float:right;font-size:.68rem;padding:2px 8px;border-radius:999px;font-weight:700;background:"+confBg(cls)+";color:"+confColor(cls)+"'>"+lbl+" "+conf+"</span></div>"+
    "<div style='font-size:2.2rem;font-weight:700;line-height:1'>"+Math.round(c.temperature_2m)+"<span style='font-size:1rem;color:#9aa4b8'>°C</span></div>"+
    "<div style='color:#9aa4b8;font-size:.8rem;margin:4px 0'>"+txt+" · feels "+Math.round(c.apparent_temperature??c.temperature_2m)+"° · wind "+Math.round(c.wind_speed_10m)+" km/h</div>"+
    (temps.length>1?"<div style='color:#9aa4b8;font-size:.75rem'>Spread "+spread.toFixed(1)+"°C across "+temps.length+" models</div>":"")+
    "<div style='margin:8px 0 2px;font-size:.68rem;color:#9aa4b8;text-transform:uppercase;letter-spacing:.05em'>Provider spread</div>"+rows+
    "<div style='display:flex;gap:4px;margin-top:8px;border-top:1px solid #232a3a;padding-top:8px'>"+days+"</div>";
}
const confBg=c=>c==="high"?"#16a34a33":c==="med"?"#d9770633":"#dc262633";
const confColor=c=>c==="high"?"#4ade80":c==="med"?"#fbbf24":"#f87171";

// ---------- Deep Chat handler ----------
const chat=document.getElementById("chat");
const buildConnect=()=>({handler:async(body,signals)=>{
  const msgs=body.messages||[];
  const last=msgs[msgs.length-1];
  const text=(last?.text||"").trim();
  if(!text){signals.onResponse({text:"(empty message)"});return}
  // Weather detection
  const m=text.match(/weather(?:\s+(?:in|at|for))?[:]?\s+(?:the\s+)?(.+?)[?.!]*$/i);
  const wantsWeather=/\bweather\b|\bforecast\b|\btemperature\b/i.test(text);
  let place=null,loc=m?m[1].trim():"";
  let geoError=null;
  if(wantsWeather&&loc){try{place=await geocode(loc)}catch(e){geoError=e}}
  if(wantsWeather&&!place&&!geoError&&text.split(/\s+/).length<=6){try{place=await geocode(text)}catch(e){geoError=e}}
  // Explicit weather ask that failed to resolve -> tell the user, never fall through silently
  if(wantsWeather&&!place&&geoError){
    signals.onResponse({text:"I could not find a place matching \u201C"+(loc||text)+"\u201D. Try a city name like \u201Cweather in Mumbai\u201D or \u201Cweather in New York\u201D."});
    return;
  }
  if(place){
    try{
      const [j,tb,tg,ti]=await Promise.all([
        forecast(place.latitude,place.longitude),
        modelTemp(place.latitude,place.longitude,"best_match"),
        modelTemp(place.latitude,place.longitude,"gfs_seamless"),
        modelTemp(place.latitude,place.longitude,"icon_seamless"),
      ]);
      const models=[{id:"best_match",temp:tb},{id:"gfs_seamless",temp:tg},{id:"icon_seamless",temp:ti}]
        .filter(x=>x.temp!=null);
      const card=fusionCard(place,j,models);
      // alerts banner area above chat
      const alerts=await alertsFor(place);
      renderAlerts(alerts);
      // one short AI comment (best-effort, silent on failure)
      let comment="";
      try{
        const c=j.current||{};
        comment=await callLLM("One short friendly sentence about this weather in "+place.name+": "+c.temperature_2m+"C, "+wmo(c.weather_code)[0]+". No preamble.");
      }catch(e){}
      let html="<div>"+card+"</div>";
      if(comment)html="<div style='margin-bottom:8px'>"+esc(comment.trim())+"</div>"+html;
      signals.onResponse({html:html});
      return;
    }catch(e){
      signals.onResponse({error:"Weather service issue: "+e.message+". Try again in a moment."});
      return;
    }
  }
  // Plain chat
  const hist=(msgs.slice(-6).map(x=>((x.role==="user"?"User: ":"Infer: ")+(x.text||""))).join("\n"));
  const reply=await callLLM("You are Infer, "+(window.INFER_NAME||"Hardik")+"'s concise personal AI assistant.\nRecent conversation:\n"+hist+"\nUser: "+text+"\nReply briefly:");
  if(reply){signals.onResponse({text:reply.trim()})}
  else{signals.onResponse({text:"I could not reach the AI service just now (it is a free tier with rate limits). Please try again in a few seconds — or ask me for weather, that works independently. 🌦️"})}
}});
// Register AFTER the custom element is defined, otherwise the pre-upgrade
// property is shadowed by an own-property and Deep Chat falls back to demo mode.
customElements.whenDefined("deep-chat").then(()=>{
  // Cohesive dark theme — set as properties (attribute JSON quoting is fragile)
  chat.chatStyle = {backgroundColor:"#0b0e14", borderRadius:"0px", border:"none"};
  chat.messageStyles = {
    default: {shared: {bubble: {maxWidth:"88%", lineHeight:"1.5", borderRadius:"16px", boxShadow:"none", fontSize:"15px"}}},
    user: {bubble: {backgroundColor:"#2563eb", color:"#ffffff", borderRadius:"16px 16px 4px 16px"}},
    ai: {bubble: {backgroundColor:"#171c26", color:"#e6e9ef", border:"1px solid #232a3a", borderRadius:"16px 16px 16px 4px"}}
  };
  chat.textInput = {
    styles: {container: {borderRadius:"16px", border:"1px solid #232a3a", boxShadow:"none", backgroundColor:"#12161f", color:"#e6e9ef", padding:"12px 16px"},
             text: {placeholder: {text:"Ask Infer… try weather in Delhi", style:{color:"#6b7280"}}}},
    placeholder: {text:"Ask Infer… try weather in Delhi"}
  };
  chat.submitButtonStyles = {
    submit: {container: {default:{bottom:"0.75rem", right:"0.75rem", borderRadius:"12px", backgroundColor:"#2563eb"},
             hover:{backgroundColor:"#3b82f6"}, loading:{backgroundColor:"#2563eb"}, stop:{backgroundColor:"#ef4444"}},
             text: {styles: {submit:{fontSize:"16px"}}}}
  };
  chat.introMessage = {html:"Hi! I am <b>Infer</b> \u26A1 — your personal AI.<br><br>Try <b>weather in Delhi</b> or <b>weather in New York</b>, or just chat with me."};
  chat.connect = buildConnect();
});

function renderAlerts(props){
  const box=document.getElementById("alerts");box.innerHTML="";
  box.style.display=props&&props.length?"block":"none";
  for(const p of props||[]){
    const sev=(p.severity||"").toLowerCase();
    const cls=sev==="extreme"?"sev-extreme":sev==="severe"?"sev-severe":sev==="moderate"?"sev-moderate":"sev-minor";
    const d=document.createElement("div");d.className="alert "+cls;
    d.innerHTML="<b>⚠️ "+esc(p.event||"Alert")+"</b>"+esc(p.headline||p.areaDesc||"");
    box.appendChild(d);
  }
}
</script>
</body>
</html>
